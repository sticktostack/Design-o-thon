<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design O Thon - Admin Login</title>

  <link rel="stylesheet" href="/client/admin/css/login.css">
</head>
<body>
<div class="cursor-glow"></div>
  <div class="canvas-bg"></div>
  <div class="blobs"></div>

  <div class="hackathon-layout">

    <!-- LEFT CREATIVE PANEL -->
    <div class="left-info">
      <h1>Design O Thon</h1>
      <p>Where designers build, compete & innovate</p>

      <div class="tags">
        <span>#UI/UX</span>
        <span>#Creativity</span>
        <span>#Innovation</span>
        <span>#Hackathon</span>
      </div>

      <div class="note">
        Build. Design. Compete. Repeat.
      </div>
    </div>

    <!-- RIGHT LOGIN POD -->
    <div class="login-pod">

      <h2>Admin Access</h2>
      <p>Enter your credentials to continue</p>

      <form id="loginForm">

        <input type="email" id="email" placeholder="Admin Email">

        <input type="password" id="password" placeholder="Password">

        
        <button type="submit">Enter Dashboard</button>

      </form>

      <p id="message"></p>

    </div>

  </div>
<script src="js/login.js"></script>
</body>
</html>
