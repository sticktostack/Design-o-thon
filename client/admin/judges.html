    <!-- ============================= -->
    <!-- Add Judge Form -->
    <!-- ============================= -->
    <section class="assignment-form-card">

      <h2>Add Judges or Mentors</h2>

      <form id="judgeForm">

        <input
          type="text"
          id="name"
          placeholder="Full Name"
          required
        >

        <input
          type="email"
          id="email"
          placeholder="Email"
          required
        >

        <input
          type="text"
          id="expertise"
          placeholder="Expertise (UI/UX, Branding, Product etc.)"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Login Password"
          required
        >

        <button type="submit">
          Add
        </button>

      </form>

      <p id="message"></p>

    </section>
